name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx vue-tsc --noEmit

  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.arch }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: apt-${{ runner.arch }}-

      - name: Install system dependencies
        timeout-minutes: 18
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-cache/partial
          apt="apt-get -o Dir::Cache::Archives=$HOME/apt-cache -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          for attempt in 1 2 3; do
            if sudo timeout 300 sh -c "$apt update && $apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config"; then
              sudo chown -R "$USER" ~/apt-cache
              exit 0
            fi
            echo "::warning::apt-get attempt $attempt failed or stalled, retrying on archive.ubuntu.com"
            sudo sed -i 's#http://azure.archive.ubuntu.com/#http://archive.ubuntu.com/#' /etc/apt/apt-mirrors.txt 2>/dev/null || true
            sudo dpkg --configure -a || true
            sleep 10
          done
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: Check formatting
        working-directory: ./src-tauri
        run: cargo fmt --check

      - name: Check compilation
        working-directory: ./src-tauri
        run: cargo check --locked

      - name: Run tests
        working-directory: ./src-tauri
        run: cargo test --locked

  backend-windows:
    name: Backend Check (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: Check compilation
        working-directory: ./src-tauri
        run: cargo check --locked

      - name: Run tests
        working-directory: ./src-tauri
        run: cargo test --locked

  clippy:
    name: Clippy (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.arch }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: apt-${{ runner.arch }}-

      - name: Install system dependencies
        timeout-minutes: 18
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-cache/partial
          apt="apt-get -o Dir::Cache::Archives=$HOME/apt-cache -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          for attempt in 1 2 3; do
            if sudo timeout 300 sh -c "$apt update && $apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config"; then
              sudo chown -R "$USER" ~/apt-cache
              exit 0
            fi
            echo "::warning::apt-get attempt $attempt failed or stalled, retrying on archive.ubuntu.com"
            sudo sed -i 's#http://azure.archive.ubuntu.com/#http://archive.ubuntu.com/#' /etc/apt/apt-mirrors.txt 2>/dev/null || true
            sudo dpkg --configure -a || true
            sleep 10
          done
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: Run clippy
        working-directory: ./src-tauri
        run: cargo clippy --locked
