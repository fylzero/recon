name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure Apple signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate secret; using ad-hoc signing."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<EOF"
            echo "$APPLE_CERTIFICATE"
            echo "EOF"
            echo "APPLE_CERTIFICATE_PASSWORD<<EOF"
            echo "$APPLE_CERTIFICATE_PASSWORD"
            echo "EOF"
            echo "APPLE_SIGNING_IDENTITY<<EOF"
            echo "$APPLE_SIGNING_IDENTITY"
            echo "EOF"
            echo "APPLE_ID<<EOF"
            echo "$APPLE_ID"
            echo "EOF"
            echo "APPLE_PASSWORD<<EOF"
            echo "$APPLE_PASSWORD"
            echo "EOF"
            echo "APPLE_TEAM_ID<<EOF"
            echo "$APPLE_TEAM_ID"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Recon v__VERSION__
          releaseBody: "Download Recon-macos-arm64.dmg for Apple Silicon Macs."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: "--target aarch64-apple-darwin"
          releaseAssetNamePattern: "Recon-macos-arm64[ext]"
