name: Bug Report
description: Report a bug or issue with Recon
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us understand and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: When I do X, Y happens instead of Z...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Open a connection to...
        2. Click on...
        3. Execute query...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: The query should return results without error.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: The app crashed / showed an error message / returned incorrect results.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Recon Version
      description: Which version of Recon are you using? (Check About menu or DMG filename)
      placeholder: "1.8.1"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS Version
      description: Which version of macOS are you running?
      placeholder: "macOS 14.2 (Sonoma)"
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database Type
      description: Which database are you connecting to?
      options:
        - MySQL
        - MariaDB
        - PostgreSQL
        - SQLite
        - Not applicable
    validations:
      required: true

  - type: input
    id: database-version
    attributes:
      label: Database Version
      description: If applicable, what version of the database server?
      placeholder: "PostgreSQL 15.3"

  - type: textarea
    id: logs
    attributes:
      label: Error Messages or Logs
      description: |
        Any error messages, stack traces, or relevant console output.
        You can run Recon from Terminal to see console logs: `/Applications/Recon.app/Contents/MacOS/Recon`
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem, such as when it started happening or if it's reproducible.
