name: Feature Request
description: Suggest a new feature or enhancement for Recon
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please provide as much detail as possible to help us understand your idea.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A brief description of the feature you'd like to see.
      placeholder: Add support for...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: |
        What problem does this feature solve? Or what use case does it enable?
        Is this something you need for your workflow?
      placeholder: |
        I'm often doing X and it would be easier if...
        Currently there's no way to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work? Describe the behavior or UI you envision.
      placeholder: |
        Add a button that...
        When I right-click on a table, I should be able to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I currently work around this by...

  - type: dropdown
    id: database
    attributes:
      label: Database Type
      description: Is this feature specific to a particular database?
      options:
        - All databases
        - MySQL / MariaDB
        - PostgreSQL
        - SQLite
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: |
        Any other context, screenshots, mockups, or examples that help explain the feature.
        Links to how other tools implement similar features are also helpful.
