[package]
name = "Recon"
version = "1.11.0"
description = "A database client for MySQL, PostgreSQL, and SQLite"
authors = ["RazorKode LLC"]
license = "MIT"
edition = "2021"

[lib]
name = "recon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["io-util", "net", "process", "rt", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "mysql",
    "postgres",
    "sqlite",
] }
futures-util = "0.3"
flate2 = "1"
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
dbus-secret-service = "4"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
